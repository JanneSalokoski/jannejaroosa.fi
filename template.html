<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{title}</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Great+Vibes&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Roosa &amp; Janne</h1>
    <h2 class="subtitle">30.8.2025 klo 14.00 - Kallion kirkko</h2>
    <main>
        <div class="rsvp">
            <h2>Tervetuloa häihimme!</h2>
            <p>Tässä voit kertoa, pääsetkö osallistumaan juhlaan. Toivomme vastauksia mahdollisimman pian, kuitenkin viimeistään 14.8.2025 mennessä. Kutsuun voit vastata myös viestitse meille.</p>
            <div class="form">
                <label for="name">Nimesi:</label>
                <input id="name" type="text" value="Roosa Saranpää" />

                <label for="diet">Ruokavalio:</label>
                <textarea id="diet" placeholder="esim. gluteeniton ja maidoton"></textarea>

                <label for="rsvp">Osallistun:</label>
                <input id="rsvp" type="checkbox" checked />

                <input id="save" type="submit" value="Lähetä vastaus" />
            </div>
        </div>
        {content}
    </main>
  </body>
</html>
